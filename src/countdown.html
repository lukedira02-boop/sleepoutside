<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Try the SleepOutside countdown timer activity." />
    <title>Sleep Outside | Countdown Activity</title>
    <link rel="stylesheet" href="%BASE_URL%css/style.css" />
    <script type="module" src="%BASE_URL%js/countdown.js"></script>
  </head>
  <body>
    <header class="site-header divider">
      <div class="logo">
        <img src="%BASE_URL%images/noun_Tent_2517.svg" alt="" />
        <a href="%BASE_URL%index.html">Sleep<span class="highlight">Outside</span></a>
      </div>
      <div class="cart">
        <a href="%BASE_URL%cart/index.html" aria-label="View shopping cart">
          Cart
        </a>
      </div>
    </header>
    <main class="divider">
      <section class="countdown-app" aria-labelledby="countdown-title">
        <h1 id="countdown-title">Countdown timer</h1>
        <p>Choose a duration and start the timer.</p>
        <label for="duration">Duration in seconds</label>
        <input id="duration" type="number" min="1" max="3600" value="10" />
        <output id="countdown" aria-live="polite">00:10</output>
        <div class="countdown-controls">
          <button id="start-button" type="button">Start</button>
          <button id="pause-button" type="button" disabled>Pause</button>
          <button id="reset-button" type="button">Reset</button>
        </div>
        <p id="countdown-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <footer class="site-footer">
      <span>&copy;2025 ⛺ SleepOutside ⛺ WDD 330 ⛺ BYU-Idaho for BYU-Pathway Worldwide Online</span>
      <a href="%BASE_URL%countdown.html">Try the countdown timer activity</a>
    </footer>
  </body>
</html>
