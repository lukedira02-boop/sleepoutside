<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="%BASE_URL%css/style.css" />
    <script type="module" src="%BASE_URL%js/checkout.js"></script>
  </head>

  <body>
    <header class="site-header divider">
      <div class="logo">
        <img src="%BASE_URL%images/noun_Tent_2517.svg" alt="" />
        <a href="%BASE_URL%index.html">Sleep<span class="highlight">Outside</span></a>
      </div>
      <a class="checkout-cart-link" href="%BASE_URL%cart/index.html">Return to cart</a>
    </header>

    <main class="divider">
      <h1>Review &amp; place your order</h1>
      <div class="checkout-layout">
        <form id="checkout-form" class="checkout-form" novalidate>
          <fieldset>
            <legend>Contact and delivery</legend>
            <div class="checkout-fields">
              <label for="fname">First name</label>
              <input id="fname" name="fname" autocomplete="given-name" required />

              <label for="lname">Last name</label>
              <input id="lname" name="lname" autocomplete="family-name" required />

              <label for="street">Street address</label>
              <input id="street" name="street" autocomplete="street-address" required />

              <label for="city">City</label>
              <input id="city" name="city" autocomplete="address-level2" required />

              <label for="state">State</label>
              <input
                id="state"
                name="state"
                autocomplete="address-level1"
                minlength="2"
                maxlength="2"
                pattern="[A-Za-z]{2}"
                title="Enter the two-letter state abbreviation."
                required
              />

              <label for="zip">ZIP code</label>
              <input
                id="zip"
                name="zip"
                autocomplete="postal-code"
                inputmode="numeric"
                pattern="[0-9]{5}(-[0-9]{4})?"
                title="Enter a 5-digit ZIP code, optionally followed by a 4-digit extension."
                required
              />
            </div>
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <div class="checkout-fields">
              <label for="cardNumber">Card number</label>
              <input
                id="cardNumber"
                name="cardNumber"
                autocomplete="cc-number"
                inputmode="numeric"
                minlength="16"
                maxlength="16"
                pattern="[0-9]{16}"
                title="Enter the 16-digit card number."
                required
              />

              <label for="expiration">Expiration date (MM/YY)</label>
              <input
                id="expiration"
                name="expiration"
                autocomplete="cc-exp"
                inputmode="numeric"
                maxlength="5"
                pattern="(0?[1-9]|1[0-2])/[0-9]{2}"
                placeholder="MM/YY"
                title="Enter a future expiration date as MM/YY."
                required
              />

              <label for="code">Security code</label>
              <input
                id="code"
                name="code"
                autocomplete="cc-csc"
                inputmode="numeric"
                minlength="3"
                maxlength="4"
                pattern="[0-9]{3,4}"
                title="Enter the 3- or 4-digit security code."
                required
              />
            </div>
          </fieldset>

          <button id="checkoutSubmit" class="checkout-submit" type="submit">
            Place order
          </button>
        </form>

        <section class="order-summary" aria-labelledby="order-summary-title">
          <h2 id="order-summary-title">Order summary</h2>
          <p>Items (<span id="item-count">0</span>): <strong id="subtotal">$0.00</strong></p>
          <p>Tax: <strong id="tax">$0.00</strong></p>
          <p>Shipping: <strong id="shipping">$0.00</strong></p>
          <p class="order-total">Order total: <strong id="order-total">$0.00</strong></p>
          <p id="zip-hint" class="checkout-hint">Enter a valid ZIP code to calculate tax and shipping.</p>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <span>&copy; 2025 SleepOutside | WDD 330 | BYU-Idaho</span>
      <a href="%BASE_URL%countdown.html">Try the countdown timer activity</a>
    </footer>
  </body>
</html>
